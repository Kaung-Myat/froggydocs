name: froggy_docs
description: >
  Auto-generate API documentation from code annotations. 
  Works with any programming language (JavaScript, Python, Go, Ruby, etc.)
version: 1.2.0-beta.1
repository: https://github.com/Kaung-Myat/froggydocs
homepage: https://github.com/Kaung-Myat/froggydocs
issue_tracker: https://github.com/Kaung-Myat/froggydocs/issues

environment:
  sdk: ^3.11.5

executables:
  froggy_docs: null

dependencies:
  args: ^2.7.0
  path: ^1.9.1
  watcher: ^1.2.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  http: ^1.4.0
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

topics:
  - api
  - documentation
  - openapi
  - swagger
  - generator
  - developer-tools
