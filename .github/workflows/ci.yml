name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: dart pub get
      - run: dart analyze
      - run: dart test
      - run: npm test
      - run: npm run verify-version
      - run: npm pack --dry-run
      - run: dart compile exe bin/froggy_docs.dart -o /tmp/froggy-docs
